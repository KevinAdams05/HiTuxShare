<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="780" viewBox="0 0 1040 780" font-family="DejaVu Sans, Helvetica, Arial, sans-serif">
  <rect width="1040" height="780" fill="#ffffff"/>
  <defs>
    <marker id="a1" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1967d2"/>
    </marker>
    <marker id="a2" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#188038"/>
    </marker>
    <marker id="a3" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9334e6"/>
    </marker>
  </defs>

  <text x="520" y="32" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">BeShare-over-MUSCLE wire protocol — what each phase actually speaks</text>
  <text x="520" y="53" text-anchor="middle" font-size="13" fill="#5f6368">Framing: 8-byte header = LE uint32 bodySize + LE uint32 magic 0x456E6330 ('Enc0'), then the flattened Message</text>

  <!-- lifelines -->
  <rect x="60" y="76" width="190" height="38" rx="6" fill="#e8f0fe" stroke="#1967d2" stroke-width="2"/>
  <text x="155" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#174ea6">HiTuxShare client</text>

  <rect x="425" y="76" width="190" height="38" rx="6" fill="#fce8e6" stroke="#d93025" stroke-width="2"/>
  <text x="520" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#a50e0e">muscled  (port 2960)</text>

  <rect x="790" y="76" width="190" height="38" rx="6" fill="#f3e8fd" stroke="#9334e6" stroke-width="2"/>
  <text x="885" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#6a1b9a">peer client</text>

  <line x1="155" y1="114" x2="155" y2="744" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="520" y1="114" x2="520" y2="560" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="885" y1="114" x2="885" y2="744" stroke="#9aa0a6" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- PHASE 1 band -->
  <rect x="30" y="126" width="980" height="212" rx="8" fill="#f8fbff" stroke="#1967d2" stroke-width="1.5"/>
  <text x="44" y="145" font-size="13" font-weight="bold" fill="#174ea6">PHASE 1 — CHAT  (client ↔ server only; ~150 lines of protocol, proven by muscle's own python_chat.py)</text>

  <line x1="155" y1="166" x2="512" y2="166" stroke="#1967d2" stroke-width="2" marker-end="url(#a1)"/>
  <text x="163" y="161" font-size="11.5" fill="#174ea6">TCP connect</text>

  <line x1="155" y1="196" x2="512" y2="196" stroke="#1967d2" stroke-width="2" marker-end="url(#a1)"/>
  <text x="163" y="191" font-size="11.5" fill="#174ea6">PR_COMMAND_SETDATA  { "beshare/name" = {name, port, version_name, version_num, installid} }</text>

  <line x1="155" y1="226" x2="512" y2="226" stroke="#1967d2" stroke-width="2" marker-end="url(#a1)"/>
  <text x="163" y="221" font-size="11.5" fill="#174ea6">PR_COMMAND_SETPARAMETERS  { "SUBSCRIBE:beshare/*" = true }</text>

  <line x1="518" y1="256" x2="161" y2="256" stroke="#188038" stroke-width="2" marker-end="url(#a2)"/>
  <text x="220" y="251" font-size="11.5" fill="#137333">PR_RESULT_DATAITEMS  — /host/sessionID/beshare/{name,userstatus,filecount,bandwidth}</text>

  <line x1="518" y1="286" x2="161" y2="286" stroke="#188038" stroke-width="2" marker-end="url(#a2)"/>
  <text x="220" y="281" font-size="11.5" fill="#137333">PR_RESULT_PARAMETERS  — PR_NAME_SESSION_ROOT gives us our own session ID</text>

  <line x1="155" y1="316" x2="512" y2="316" stroke="#1967d2" stroke-width="2" marker-end="url(#a1)"/>
  <text x="163" y="311" font-size="11.5" fill="#174ea6">what=2 NET_CLIENT_NEW_CHAT_TEXT  { PR_NAME_KEYS="/*/*/beshare", session, text, [private] }</text>

  <!-- PHASE 2 band -->
  <rect x="30" y="350" width="980" height="200" rx="8" fill="#f6fbf7" stroke="#188038" stroke-width="1.5"/>
  <text x="44" y="369" font-size="13" font-weight="bold" fill="#0d652d">PHASE 2 — QUERY + DOWNLOAD  (server gives the index; the bytes come straight from the peer)</text>

  <line x1="155" y1="390" x2="512" y2="390" stroke="#1967d2" stroke-width="2" marker-end="url(#a1)"/>
  <text x="163" y="385" font-size="11.5" fill="#174ea6">PR_COMMAND_SETPARAMETERS  { "SUBSCRIBE:/*/&lt;sessionExp&gt;/beshare/fi*/&lt;fileExp&gt;" }</text>

  <line x1="518" y1="418" x2="161" y2="418" stroke="#188038" stroke-width="2" marker-end="url(#a2)"/>
  <text x="220" y="413" font-size="11.5" fill="#137333">PR_RESULT_DATAITEMS — beshare:File Size / Modification Time / Path / Kind  (live, keeps arriving)</text>

  <line x1="518" y1="446" x2="161" y2="446" stroke="#188038" stroke-width="2" marker-end="url(#a2)"/>
  <text x="220" y="441" font-size="11.5" fill="#137333">PR_RESULT_PONG — our PR_COMMAND_PING came back, so the initial index sweep is done</text>

  <line x1="161" y1="480" x2="879" y2="480" stroke="#9334e6" stroke-width="2" marker-end="url(#a3)"/>
  <text x="380" y="475" font-size="11.5" fill="#6a1b9a">direct TCP to peer's advertised host:port  →  TRANSFER_COMMAND_PEER_ID, then FILE_LIST</text>

  <line x1="879" y1="512" x2="161" y2="512" stroke="#9334e6" stroke-width="2" marker-end="url(#a3)"/>
  <text x="380" y="507" font-size="11.5" fill="#6a1b9a">FILE_HEADER {beshare:File Name/Size/Path/Kind, [StartOffset], [SendLength]}</text>

  <line x1="879" y1="540" x2="161" y2="540" stroke="#9334e6" stroke-width="2" marker-end="url(#a3)"/>
  <text x="380" y="535" font-size="11.5" fill="#6a1b9a">FILE_DATA { data:B_RAW_TYPE, chk:checksum, mm:mungeMode } × N  until the file is done</text>

  <!-- PHASE 3 band -->
  <rect x="30" y="562" width="980" height="196" rx="8" fill="#fdf7ff" stroke="#9334e6" stroke-width="1.5"/>
  <text x="44" y="581" font-size="13" font-weight="bold" fill="#6a1b9a">PHASE 3 — SHARING  (we become the peer that others download from)</text>

  <line x1="155" y1="602" x2="512" y2="602" stroke="#1967d2" stroke-width="2" marker-end="url(#a1)"/>
  <text x="163" y="597" font-size="11.5" fill="#174ea6">PR_COMMAND_SETDATA { "beshare/files/&lt;filename&gt;" = {beshare:File Size, Modification Time, Path, Kind} } × N</text>

  <text x="163" y="626" font-size="11" fill="#5f6368">node path is "beshare/fires/…" instead when we are firewalled — that single letter is how peers learn they must connect back</text>

  <line x1="155" y1="652" x2="512" y2="652" stroke="#1967d2" stroke-width="2" marker-end="url(#a1)"/>
  <text x="163" y="647" font-size="11.5" fill="#174ea6">PR_COMMAND_SETDATA { "beshare/filecount", "beshare/uploadstats" }</text>

  <line x1="879" y1="684" x2="161" y2="684" stroke="#9334e6" stroke-width="2" marker-end="url(#a3)"/>
  <text x="330" y="679" font-size="11.5" fill="#6a1b9a">peer connects in to our listening port  →  we serve FILE_HEADER + FILE_DATA</text>

  <line x1="155" y1="716" x2="512" y2="716" stroke="#1967d2" stroke-width="2" marker-end="url(#a1)"/>
  <text x="163" y="711" font-size="11.5" fill="#174ea6">what=3 NET_CLIENT_CONNECT_BACK_REQUEST { PR_NAME_KEYS="/*/&lt;peer&gt;/beshare", session, port }</text>
  <text x="163" y="740" font-size="11" fill="#5f6368">the firewalled-peer escape hatch: the server relays a "you call me" request. Two firewalled peers can never transfer — protocol limit.</text>
</svg>
